name: Build cPanel runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one generated runtime may publish this shared branch at a time.
# A newer source push remains queued instead of racing an older build.
concurrency:
  group: cpanel-runtime-publish
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The cPanel app delegates WhatsApp QR to the local/remote worker.
      # Building as polling_worker makes Next include the local Chromium
      # transport, whose whatsapp-web.js dependency is intentionally absent
      # from the shared-hosting runtime.
      WHATSAPP_MODE: remote_worker
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: https://jpmassagem.pt
      NEXT_PUBLIC_SITE_URL: https://jpmassagem.pt
      APP_URL: https://jpmassagem.pt
      NEXT_PUBLIC_APP_LOCALE: pt

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Check Linux CSS/runtime resolution
        run: |
          node -e "for (const m of ['tailwindcss','@tailwindcss/postcss','lightningcss']) { console.log(m + ' => ' + require.resolve(m)) }"
          node -e "const fs=require('fs'); for (const p of ['node_modules/shadcn/dist/tailwind.css','node_modules/tw-animate-css/dist/tw-animate.css']) { if (!fs.existsSync(p)) { throw new Error(p + ' not found') } console.log(p + ' OK') }"

      - name: Build Next.js standalone runtime
        run: npm run build:cpanel
        env:
          NODE_ENV: production

      - name: Assemble cPanel runtime branch
        shell: bash
        run: |
          rm -rf cpanel-runtime
          git fetch origin cpanel-runtime:refs/remotes/origin/cpanel-runtime
          git worktree add --detach cpanel-runtime origin/cpanel-runtime
          find cpanel-runtime -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p cpanel-runtime/.next
          # CloudLinux Node.js Selector reserves node_modules for the virtual
          # environment symlink. Keep the prebuilt Next output, but let cPanel
          # install runtime dependencies into that environment.
          rsync -a --exclude='node_modules/' .next/standalone/ cpanel-runtime/
          cp -a .next/static cpanel-runtime/.next/static
          cp -a public cpanel-runtime/public
          cp .cpanel.yml .gitignore cpanel-runtime/
          mkdir -p cpanel-runtime/mysql cpanel-runtime/scripts
          cp -a mysql/migrations cpanel-runtime/mysql/migrations
          cp scripts/mysql-migrate.mjs cpanel-runtime/scripts/mysql-migrate.mjs
          cp package-lock.json cpanel-runtime/package-lock.json
          node <<'EOF'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dependencies = { ...source.dependencies };
          // The browser-based WhatsApp client runs exclusively on the local
          // worker. Installing it on shared cPanel also pulls Puppeteer and can
          // exceed the hosting memory limit during npm install.
          delete dependencies['whatsapp-web.js'];
          const runtime = {
            name: source.name,
            version: source.version,
            private: true,
            engines: source.engines,
            scripts: {
              start: 'node server.js',
            },
            dependencies,
            overrides: source.overrides,
          };
          fs.writeFileSync(
            'cpanel-runtime/package.json',
            `${JSON.stringify(runtime, null, 2)}\n`,
          );
          EOF
          (
            cd cpanel-runtime
            npm install --package-lock-only --omit=dev --ignore-scripts
          )
          if grep -q 'node_modules/puppeteer' cpanel-runtime/package-lock.json; then
            echo 'Runtime lockfile must not contain Puppeteer.' >&2
            exit 1
          fi
          if find cpanel-runtime -type d -name node_modules -print -quit | grep -q .; then
            echo 'Runtime must not contain a node_modules directory.' >&2
            exit 1
          fi
          mv cpanel-runtime/server.js cpanel-runtime/next-server.js
          cat > cpanel-runtime/server.js <<'EOF'
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');

          try {
            console.log('cPanel: applying pending MySQL migrations...');
            execFileSync(process.execPath, [path.join(__dirname, 'scripts/mysql-migrate.mjs')], {
              cwd: __dirname,
              env: process.env,
              stdio: 'inherit',
            });
          } catch (error) {
            console.error('cPanel: MySQL migration failed. Starting the application with the existing schema.');
          }

          require('./next-server.js');
          EOF
          cat > cpanel-runtime/README.md <<'EOF'
          # AJ Massagem CRM cPanel runtime

          Esta branch e gerada automaticamente pelo GitHub Actions.

          No cPanel:
          - Branch: cpanel-runtime
          - Application startup file: server.js
          - Execute `Run NPM Install` uma vez apos criar a aplicacao
          - Nao execute `npm run build`
          - As migrations MySQL pendentes sao aplicadas automaticamente no arranque
          - Configure as variaveis de ambiente no Setup Node.js App
          - Use Restart Application apos cada pull
          EOF

      - name: Publish cPanel runtime branch
        shell: bash
        run: |
          cd cpanel-runtime
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Runtime output is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Build cPanel runtime from ${GITHUB_SHA}"
          git push origin HEAD:cpanel-runtime
