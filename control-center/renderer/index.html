<!doctype html>
<html lang="pt-PT"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>JP Massagem — Control Center</title><link rel="stylesheet" href="./styles.css" /></head><body>
<main class="app-shell"><header class="topbar"><div class="brand"><span>✦</span><div><strong>JP MASSAGEM</strong><small>CENTRO DE CONTROLO</small></div></div><div id="overall-status" class="system-status">● A verificar serviços</div><div class="clock"><span id="today"></span><b id="time"></b><small>Lisboa</small></div><div class="top-actions"><button data-action="restart-all">Reiniciar tudo</button><button data-view="logs">Logs</button><button id="export">Exportar diagnóstico</button></div></header>
<div class="app-layout"><aside class="sidebar"><p class="sidebar-label">OPERAÇÃO</p><button class="nav active" data-view="dashboard"><span>⌂</span> Visão geral<small>Estado do CRM</small></button><button class="nav" data-view="whatsapp"><span>◉</span> WhatsApp<small>Sessão, Inbox e QR</small></button><button class="nav" data-view="ai-tunnel"><span>☁</span> AI Tunnel<small>Acesso externo</small></button><button class="nav" data-view="ai-worker"><span>◈</span> AI Worker<small>Ollama e respostas</small></button><button class="nav" data-view="system"><span>◌</span> Sistema<small>Recursos do PC</small></button><button class="nav" data-view="logs"><span>▤</span> Logs<small>Eventos em tempo real</small></button><div class="sidebar-help"><b>Atalhos</b><p>R — reiniciar serviços</p><p>L — abrir Logs</p><p>Q — fechar painel</p></div></aside><section id="workspace" class="workspace" aria-live="polite"></section></div></main>
<script src="./renderer.js"></script></body></html>
